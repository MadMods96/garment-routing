# Attribute-only usage models. Photographs are not inputs.
# Brand frequency and both estimators are fit on the train split.
# Validation is used for LightGBM early stopping and permutation importance.
# Test, station 3, and the gold set are not used to fit or to rank features.
target: usage
features:
  - condition
  - pilling
  - stains
  - holes
  - material
  - type
  - brand_frequency
  - trend
categorical:
  - stains
  - holes
  - material
  - type
  - trend
numeric:
  - condition
  - pilling
  - brand_frequency
brand_frequency: train_proportion
importance_repeats: 5
# Simple random sample of station 3, used only to estimate the class prior.
# Those garments are excluded from the station 3 scores below.
station3_prior_sample_size: 200
logistic_regression:
  solver: lbfgs
  l1_ratio: 0.0
  C: 1.0
  class_weight: balanced
  max_iter: 300
  tol: 0.001
lightgbm:
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.9
  colsample_bytree: 0.9
  class_weight: balanced
  early_stopping_rounds: 40
