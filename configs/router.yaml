placeholder_notice: >
  Every number in this file is an illustrative placeholder for a portfolio demo.
  These are not life-cycle assessment results, not a sorting partner's prices,
  and not measured repair capacity.

route_order:
  - Reuse
  - Export
  - Repair
  - Remake
  - Recycle
  - Energy recovery

route_value:
  Reuse: 1.00
  Export: 0.70
  Repair: 0.60
  Remake: 0.40
  Recycle: 0.30
  Energy recovery: 0.05

condition_bonus_routes: [Reuse, Export]
condition_bonus:
  "1": -0.50
  "2": -0.25
  "3": 0.00
  "4": 0.15
  "5": 0.30

damage_adjustments:
  holes:
    Minor:
      Repair: 0.45
      Reuse: -0.20
      Export: -0.15
    Major:
      Reuse: -1.00
      Export: -0.40
      Repair: 0.05
      Remake: 0.20
      Recycle: 0.15
  stains:
    Minor:
      Reuse: -0.10
      Repair: 0.15
    Major:
      Reuse: -0.60
      Export: -0.30
      Recycle: 0.10
      Repair: 0.05
    Minor_or_Major:
      Reuse: -0.15
      Repair: 0.05
  smell:
    Major:
      Reuse: -0.25
      Export: -0.20
      Recycle: 0.05

high_value_fibres: [wool, ull, silk, siden, silke, cashmere, kashmir]
high_value_bonus:
  Repair: 0.40
  Reuse: 0.15
  Remake: 0.20
  Recycle: -0.10

env_weight:
  Reuse: 0.25
  Repair: 0.22
  Remake: 0.12
  Export: 0.08
  Recycle: 0.05
  Energy recovery: 0.00

model_probability_weight: 0.35
score_temperature: 1.0
abstain_confidence: 0.55

hard_rules:
  - name: major_holes_poor_condition
    holes: Major
    condition_lte: 2
    forbid: [Reuse]
    reason: "major holes and condition at or below 2/5"
  - name: major_stains_poor_condition
    stains: Major
    condition_lte: 2
    forbid: [Reuse]
    reason: "major stains and condition at or below 2/5"

# Illustrative partner slots for one batch. Omitted routes are uncapped.
capacity:
  Repair: 40
  Remake: 15
